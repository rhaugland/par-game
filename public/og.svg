<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern background -->
  <g opacity="0.08">
    <rect x="60" y="80" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="110" y="80" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="160" y="80" width="44" height="44" rx="4" fill="#4caf50"/>
    <rect x="210" y="80" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="260" y="80" width="44" height="44" rx="4" fill="#fff"/>

    <rect x="60" y="130" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="110" y="130" width="44" height="44" rx="4" fill="#333"/>
    <rect x="160" y="130" width="44" height="44" rx="4" fill="#4caf50"/>
    <rect x="210" y="130" width="44" height="44" rx="4" fill="#333"/>
    <rect x="260" y="130" width="44" height="44" rx="4" fill="#fff"/>

    <rect x="60" y="180" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="110" y="180" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="160" y="180" width="44" height="44" rx="4" fill="#4caf50"/>
    <rect x="210" y="180" width="44" height="44" rx="4" fill="#4caf50"/>
    <rect x="260" y="180" width="44" height="44" rx="4" fill="#4caf50"/>
  </g>

  <!-- Decorative grid (right side) -->
  <g opacity="0.06" transform="translate(880, 300)">
    <rect x="0" y="0" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="50" y="0" width="44" height="44" rx="4" fill="#b3e5fc"/>
    <rect x="100" y="0" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="150" y="0" width="44" height="44" rx="4" fill="#fff"/>

    <rect x="0" y="50" width="44" height="44" rx="4" fill="#333"/>
    <rect x="50" y="50" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="100" y="50" width="44" height="44" rx="4" fill="#ffe0b2"/>
    <rect x="150" y="50" width="44" height="44" rx="4" fill="#fff"/>

    <rect x="0" y="100" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="50" y="100" width="44" height="44" rx="4" fill="#fff"/>
    <rect x="100" y="100" width="44" height="44" rx="4" fill="#333"/>
    <rect x="150" y="100" width="44" height="44" rx="4" fill="#ffcdd2"/>
  </g>

  <!-- Main title -->
  <text x="600" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="100" font-weight="200" fill="#ffffff" text-anchor="middle" letter-spacing="16">par puzzle</text>

  <!-- Tagline -->
  <text x="600" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#9e9e9e" text-anchor="middle" letter-spacing="6">DAILY MAZE CHALLENGE</text>

  <!-- Feature pills -->
  <g transform="translate(600, 390)">
    <rect x="-340" y="-18" width="120" height="36" rx="18" fill="#ffffff" opacity="0.08"/>
    <text x="-280" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#b3e5fc" text-anchor="middle" letter-spacing="1">ICE</text>

    <rect x="-190" y="-18" width="120" height="36" rx="18" fill="#ffffff" opacity="0.08"/>
    <text x="-130" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#ffe0b2" text-anchor="middle" letter-spacing="1">SAND</text>

    <rect x="-40" y="-18" width="120" height="36" rx="18" fill="#ffffff" opacity="0.08"/>
    <text x="20" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#ffcdd2" text-anchor="middle" letter-spacing="1">TRAPS</text>

    <rect x="110" y="-18" width="120" height="36" rx="18" fill="#ffffff" opacity="0.08"/>
    <text x="170" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#c8e6c9" text-anchor="middle" letter-spacing="1">TRIVIA</text>

    <rect x="260" y="-18" width="120" height="36" rx="18" fill="#ffffff" opacity="0.08"/>
    <text x="320" y="6" font-family="system-ui, sans-serif" font-size="14" fill="#fff9c4" text-anchor="middle" letter-spacing="1">TIMER</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#666" text-anchor="middle" letter-spacing="2">One puzzle. Six obstacles. Sixty seconds.</text>

  <!-- URL -->
  <text x="600" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#444" text-anchor="middle" letter-spacing="3">par-web.vercel.app</text>
</svg>
