<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Par Puzzle — Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #f5f5f7; color: #1a1a2e;
    min-height: 100vh; padding: 24px;
  }
  .header {
    text-align: center; margin-bottom: 32px;
  }
  .header h1 {
    font-size: 28px; font-weight: 200; letter-spacing: 8px;
  }
  .header p { font-size: 12px; color: #9e9e9e; margin-top: 4px; }
  .login {
    max-width: 320px; margin: 80px auto; text-align: center;
  }
  .login input {
    width: 100%; padding: 14px 16px; border: 1.5px solid #e0e0e0;
    border-radius: 12px; font-size: 14px; margin-bottom: 12px;
    outline: none;
  }
  .login input:focus { border-color: #1a1a2e; }
  .login button {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: #1a1a2e; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; max-width: 900px; margin: 0 auto 24px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .card .label {
    font-size: 10px; font-weight: 600; color: #9e9e9e;
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px;
  }
  .card .value {
    font-size: 32px; font-weight: 300;
  }
  .card .sub {
    font-size: 11px; color: #9e9e9e; margin-top: 4px;
  }
  .card .growth {
    display: inline-block; font-size: 12px; font-weight: 600;
    padding: 2px 8px; border-radius: 100px; margin-top: 6px;
  }
  .growth.up { background: #e8f5e9; color: #2e7d32; }
  .growth.down { background: #ffebee; color: #c62828; }
  .growth.flat { background: #f5f5f5; color: #9e9e9e; }
  .chart-wrap {
    max-width: 900px; margin: 0 auto;
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .chart-title {
    font-size: 10px; font-weight: 600; color: #9e9e9e;
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px;
  }
  .chart {
    display: flex; align-items: flex-end; gap: 3px; height: 120px;
  }
  .bar-group {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 1px; height: 100%;
    justify-content: flex-end;
  }
  .bar {
    width: 100%; border-radius: 3px 3px 0 0; min-height: 1px;
    transition: height 0.3s;
  }
  .bar.visitors { background: #e0e0e0; }
  .bar.accounts { background: #4caf50; }
  .bar-label {
    font-size: 7px; color: #bbb; margin-top: 4px;
    writing-mode: vertical-rl; transform: rotate(180deg);
    max-height: 40px; overflow: hidden;
  }
  .legend {
    display: flex; gap: 16px; justify-content: center; margin-top: 12px;
    font-size: 11px; color: #9e9e9e;
  }
  .legend-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 2px; margin-right: 4px; vertical-align: middle;
  }
  .error { color: #c62828; text-align: center; margin-top: 20px; font-size: 13px; }
  #dashboard { display: none; }
</style>
</head>
<body>

<div class="header">
  <h1>par puzzle</h1>
  <p>Analytics Dashboard</p>
</div>

<div id="login-form" class="login">
  <input type="password" id="admin-key" placeholder="Admin key" autocomplete="off">
  <button onclick="loadDashboard()">View Analytics</button>
  <div id="login-error" class="error"></div>
</div>

<div id="dashboard">
  <div class="grid" id="cards"></div>
  <div class="chart-wrap">
    <div class="chart-title">Daily Visitors — Last 30 Days</div>
    <div class="chart" id="chart"></div>
    <div class="legend">
      <span><span class="legend-dot" style="background:#e0e0e0"></span>Anonymous</span>
      <span><span class="legend-dot" style="background:#4caf50"></span>Accounts</span>
    </div>
  </div>
</div>

<script>
let adminKey = '';

async function loadDashboard() {
  adminKey = document.getElementById('admin-key').value.trim();
  if (!adminKey) return;

  try {
    const res = await fetch(`/api/admin?key=${encodeURIComponent(adminKey)}`);
    if (!res.ok) {
      document.getElementById('login-error').textContent = 'Invalid admin key';
      return;
    }
    const data = await res.json();
    renderDashboard(data);
  } catch (e) {
    document.getElementById('login-error').textContent = 'Failed to load data';
  }
}

function growthBadge(pct) {
  if (pct === null) return '<span class="growth flat">New</span>';
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const arrow = pct > 0 ? '\u2191' : pct < 0 ? '\u2193' : '';
  return `<span class="growth ${cls}">${arrow}${Math.abs(pct)}%</span>`;
}

function renderDashboard(d) {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  const cards = [
    { label: 'Total Visitors', value: d.totalVisitors, sub: `${d.totalAccounts} accounts, ${d.totalVisitors - d.totalAccounts} anonymous` },
    { label: 'Daily Active', value: d.dau.today, sub: `${d.dau.accounts} accounts, ${d.dau.anonymous} anon`, growth: d.dau.growth },
    { label: 'Monthly Active', value: d.mau.current, sub: `${d.mau.accounts} accounts, ${d.mau.anonymous} anon`, growth: d.mau.growth },
    { label: 'Account Rate', value: d.totalVisitors > 0 ? Math.round((d.totalAccounts / d.totalVisitors) * 100) + '%' : '0%', sub: `${d.totalAccounts} of ${d.totalVisitors} visitors` },
  ];

  document.getElementById('cards').innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
      ${c.growth !== undefined ? growthBadge(c.growth) : ''}
    </div>
  `).join('');

  // Chart
  const maxVisitors = Math.max(...d.dailyVisits.map(v => v.visitors), 1);
  document.getElementById('chart').innerHTML = d.dailyVisits.map(v => {
    const anonH = Math.round(((v.visitors - v.accounts) / maxVisitors) * 100);
    const acctH = Math.round((v.accounts / maxVisitors) * 100);
    const day = v.date.slice(5); // MM-DD
    return `
      <div class="bar-group">
        <div class="bar visitors" style="height:${anonH}%" title="${v.visitors - v.accounts} anonymous"></div>
        <div class="bar accounts" style="height:${acctH}%" title="${v.accounts} accounts"></div>
        <div class="bar-label">${day}</div>
      </div>
    `;
  }).join('');
}

// Enter key support
document.getElementById('admin-key').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadDashboard();
});
</script>
</body>
</html>
